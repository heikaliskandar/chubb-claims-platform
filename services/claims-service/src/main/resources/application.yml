spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

app:
  kafka:
    claim-events-topic: claims.claim-events.v1
    partitions: 3
    replication-factor: 1
  outbox:
    poll-interval-ms: 1000
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  security:
    demo-users:
      password: ${DEMO_USER_PASSWORD}
      users:
        claimant1: CLAIMANT
        claimant2: CLAIMANT
        officer1: OFFICER
        officer2: OFFICER
        officer3: OFFICER
        manager1: MANAGER
