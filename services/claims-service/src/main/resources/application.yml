spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims}
    username: ${DB_USERNAME:claims_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  security:
    demo-users:
      password: ${DEMO_USER_PASSWORD}
      users:
        claimant1: CLAIMANT
        claimant2: CLAIMANT
        officer1: OFFICER
        officer2: OFFICER
        officer3: OFFICER
        manager1: MANAGER
