spring:
  application:
    name: insights-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insights}
    username: ${DB_USERNAME:insights_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
