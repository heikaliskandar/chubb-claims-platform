spring:
  application:
    name: insights-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insights}
    username: ${DB_USERNAME:insights_app}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: insights-service
      auto-offset-reset: earliest

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: when_authorized

app:
  kafka:
    claim-events-topic: claims.claim-events.v1
    partitions: 3
    replication-factor: 1
  officer-teams:
    officer1: Motor Claims
    officer2: Motor Claims
    officer3: Property Claims
    lead1: Motor Claims
    lead2: Property Claims
  security:
    demo-users:
      password: ${DEMO_USER_PASSWORD}
      users:
        claimant1: CLAIMANT
        claimant2: CLAIMANT
        officer1: OFFICER
        officer2: OFFICER
        officer3: OFFICER
        lead1: OFFICER
        lead2: OFFICER
        manager1: MANAGER

springdoc:
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
