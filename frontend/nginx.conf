server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; with variables below, nginx re-resolves service IPs instead of caching them at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $claims_service http://claims-service:8081;
    set $insights_service http://insights-service:8082;

    location /api/v1/insights/ {
        proxy_pass $insights_service;
    }

    location /api/ {
        proxy_pass $claims_service;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
