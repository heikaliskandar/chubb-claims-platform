server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's embedded DNS; with variables below, nginx re-resolves service IPs instead of caching them at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $claims_service http://claims-service:8081;
    set $insights_service http://insights-service:8082;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # script-src hashes cover the two inline scripts in the built index.html (theme bootstrap, critical-CSS loader); recompute if either changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zxI7K3+bRNstEmiUvK6+rwppSSgHUZWooAW2liJINAo=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/v1/insights/ {
        proxy_pass $insights_service;
    }

    location /api/ {
        proxy_pass $claims_service;
    }

    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
