<div class="shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  <aside class="sidebar" aria-label="Main navigation">
    <span class="dots" aria-hidden="true"></span>

    <div class="sidebar-head">
      <a class="brand" [routerLink]="navItems()[0]?.link" aria-label="Home">
        <app-logo [product]="collapsed() ? undefined : 'Claims'" />
      </a>
      <button type="button" class="close" aria-label="Close menu" (click)="mobileOpen.set(false)">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <nav>
      <span class="section label">Menu</span>
      @for (item of navItems(); track item.link) {
        <a
          class="nav-item"
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed() ? item.label : null"
          (click)="mobileOpen.set(false)"
        >
          <i [class]="item.icon"></i>
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </nav>

    @if (user(); as user) {
      <div class="profile-card">
        <app-user-avatar [username]="user.username" />
        <div class="who label">
          <strong>{{ user.username }}</strong>
          <span>{{ user.position ?? user.role | label }}</span>
        </div>
        <button
          type="button"
          class="sign-out"
          aria-label="Sign out"
          [attr.title]="collapsed() ? 'Sign out' : null"
          (click)="logout()"
        >
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    }
  </aside>

  <div class="backdrop" (click)="mobileOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <p-button
        icon="pi pi-bars"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        ariaLabel="Toggle menu"
        (onClick)="toggleSidebar()"
      />
      <app-logo class="mobile-brand" product="Claims" />
      <span class="spacer"></span>
      <p-button
        [icon]="dark() ? 'pi pi-sun' : 'pi pi-moon'"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        [ariaLabel]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
        (onClick)="toggleTheme()"
      />
      @if (user(); as user) {
        <button type="button" class="profile" (click)="menu.toggle($event)">
          <app-user-avatar [username]="user.username" size="large" />
          <span class="who">
            <strong>{{ user.username }}</strong>
            <span>{{ user.position ?? user.role | label }}</span>
          </span>
          <i class="pi pi-angle-down chevron"></i>
        </button>
        <p-menu #menu [model]="userMenu()" [popup]="true" appendTo="body" />
        <input #photo type="file" accept="image/*" hidden (change)="onPhotoSelected($event)" />
        <input
          #loginImage
          type="file"
          accept="image/*"
          hidden
          (change)="onLoginImageSelected($event)"
        />
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
