<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <aside class="sidebar">
    <a class="brand" [routerLink]="navItems()[0]?.link">
      <span class="logo"><i class="pi pi-shield"></i></span>
      <span>APAC Claims</span>
    </a>

    <nav>
      <span class="section">Menu</span>
      @for (item of navItems(); track item.link) {
        <a
          class="nav-item"
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="sidebarOpen.set(false)"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="backdrop" (click)="sidebarOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <p-button
        class="menu-toggle"
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        ariaLabel="Menu"
        (onClick)="sidebarOpen.set(true)"
      />
      <span class="spacer"></span>
      @if (user(); as user) {
        <button type="button" class="profile" (click)="menu.toggle($event)">
          <p-avatar [label]="initials()" shape="circle" />
          <span class="who">
            <strong>{{ user.username }}</strong>
            <span class="muted small">{{ user.position ?? user.role | label }}</span>
          </span>
          <i class="pi pi-angle-down muted"></i>
        </button>
        <p-menu #menu [model]="userMenu" [popup]="true" appendTo="body" />
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
