<app-page-header
  title="New claim"
  [crumbs]="[{ label: 'My claims', routerLink: '/claimant' }, { label: 'New claim' }]"
/>

<form class="surface-card form-card" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <div class="field full">
      <label id="type-label">Claim type</label>
      <div class="type-options" role="radiogroup" aria-labelledby="type-label">
        @for (type of claimTypes; track type.value) {
          <button
            type="button"
            role="radio"
            class="type-option"
            [class.selected]="claimType() === type.value"
            [attr.aria-checked]="claimType() === type.value"
            (click)="form.controls.claimType.setValue(type.value)"
          >
            <span class="ms">{{ type.icon }}</span>
            {{ type.label }}
          </button>
        }
      </div>
    </div>

    <div class="field">
      <label for="market">Market</label>
      <select class="select" id="market" formControlName="market">
        @for (market of markets; track market.code) {
          <option [value]="market.code">{{ market.name }} · {{ market.currency }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="policy">Policy number</label>
      <input
        class="input"
        id="policy"
        formControlName="policyNumber"
        maxlength="50"
        placeholder="e.g. POL-SG-1001"
      />
    </div>

    <div class="field">
      <label for="date">Incident date</label>
      <input class="input" id="date" type="date" formControlName="incidentDate" [max]="today" />
    </div>

    <div class="field">
      <label for="amount">Claimed amount</label>
      <div class="input-prefix">
        <span>{{ currency() }}</span>
        <input
          class="input"
          id="amount"
          type="number"
          inputmode="decimal"
          min="0.01"
          step="0.01"
          formControlName="claimedAmount"
          placeholder="0.00"
        />
      </div>
    </div>

    <div class="field full">
      <label for="description">What happened</label>
      <textarea
        class="textarea"
        id="description"
        rows="5"
        formControlName="incidentDescription"
        maxlength="2000"
      ></textarea>
    </div>
  </div>

  <div class="form-actions">
    <a class="btn btn-ghost" routerLink="/claimant">Cancel</a>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || busy()">
      <span class="ms">send</span>
      {{ busy() ? 'Submitting…' : 'Submit claim' }}
    </button>
  </div>
</form>
